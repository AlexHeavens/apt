name: publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys to Pages must not overlap, and a running deploy must not be cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get install --yes apt-utils
      # Only main is deployed, so only main holds the real signing key. Other
      # refs (and Dependabot, which gets no secrets) sign with a throwaway key.
      - name: Import the signing key
        if: github.ref == 'refs/heads/main'
        run: gpg --batch --import <<<"$GPG_PRIVATE_KEY"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Create a throwaway signing key
        if: github.ref != 'refs/heads/main'
        run: gpg --batch --passphrase '' --quick-generate-key ci@example.invalid
      - run: ./build.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
